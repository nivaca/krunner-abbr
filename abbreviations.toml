# krunner-abbr abbreviations
# Installed to ~/.config/krunner-abbr/abbreviations.toml; edits are picked up
# automatically on the next keystroke in KRunner (no restart needed).
#
# In KRunner type the trigger keyword and an abbreviation ("ex isod"), press
# Enter, and the expansion is copied to the clipboard. The keyword alone lists all
# abbreviations; "ex settings" opens the settings dialog. Keys are case-insensitive.
#
# Placeholders
#   {date}               today, ISO           2026-10-27
#   {time}               current time         14:05
#   {now}                ISO date-time        2026-10-27T14:05:09
#   {date:%d/%m/%Y}      any strftime format after ':'
#   {date+1d}            offsets: s m h d w mo(nths) y, chainable: {now+1w-2h:%c}
#   {arg}                text typed after the abbreviation ("gh octocat")
#   {arg:default}        ... with a default when nothing is typed
#   {uuid}               random UUID4
#   {env:USER}           environment variable
#   {clipboard}          current clipboard contents
#   {input}              text typed after the abbreviation, or else the clipboard
#   {ask:Label}          opens an input box when Enter is pressed; {ask:Label=default}
#                        pre-fills it; the same label asks once. Cancel copies nothing.
#   {asktext:Label}      same, with a multi-line box
#   {cmd:shell command}  stdout of a command (see cmd_timeout); $ABBR_ARG holds {arg},
#                        $ABBR_INPUT holds {input}, $ABBR_ASK1, $ABBR_ASK2… the answers
#                        to prompts ($ABBR_ASK the first). Placeholders can't contain { or }.
#   {{ and }}            literal braces: \emph{{{input}}} → \emph{text}
#
# Filters transform any placeholder and can be chained: {clipboard|unhyphen|join}
#   upper lower title sentence swapcase   case (title = English title case)
#   capitalize                             Capitalize Every Word (no title-case rules)
#   alternating randomcase                 aLtErNaTiNg cAsE, rAnDOm CasE
#   join  join(", ")                       join lines with a space / a separator
#   unhyphen                               rejoin words hyphenated across lines (PDFs)
#   squeeze strip                          collapse runs of spaces / trim
#   replace(old, new)  sub(regex, repl)    literal / regex replacement
#   deaccent slug                          café → cafe, url-slug
#   snake kebab camel pascal constant dot  identifier styles; also split camelCase input:
#                                          parseHTTPResponse → parse_http_response
#   train ada cobol path flat              Train-Case Ada_Case COBOL-CASE path/case flatcase
#   space start                            identifier → words: parse http response,
#                                          Parse HTTP Response
#   sort  sort(reverse)                    sort lines: natural order, ignoring case and accents
#   sortitems(", ")                        sort a one-line list: pear, apple → apple, pear
#   uniq reverse shuffle number            drop duplicates / reverse / shuffle / 1. 2. 3.
#   urlencode urldecode base64 unbase64
#   roman unroman                          2026 ↔ MMXXVI
#   nomacrons vtou jtoi                    Latin: ā → a, v → u, j → i
#   latex                                  escape & % $ # _ { } ~ ^ \
#   stats words chars                      "12 words · 70 characters · 2 lines"
#   quotes(from, to)                       convert quote styles; give several pairs to
#                                          convert them together (safe for nesting):
#                                          quotes(guillemets, double, double, single)
#                                          styles: straight straight-single double single
#                                          guillemets single-guillemets french low low-single,
#                                          or a literal pair such as «» or “”
#   smartquotes straightquotes             "…" '…' → “…” ‘…’ (with apostrophes) / back
#   sh(command)                            pipe through a shell command: sh(sort -u)
#   silent                                 discard the value: {ask:N|silent}{cmd:… $ABBR_ASK …}
# Quote filter arguments that contain spaces or commas: replace(" ", "_").
# In {cmd:...}, write shell pipes with spaces ("a | sort") so they aren't read as filters.
#
# Values are either a plain string or a table with text / description / icon / lazy.
# lazy = true computes the expansion only when Enter is pressed (for slow commands such
# as network lookups); a notification shows what was copied.

[settings]
prefix = "ex"          # trigger keyword: type "ex isod"; "" = match abbreviations directly
min_prefix_chars = 2   # also suggest abbreviations starting with what you typed; 0 = exact only
cmd_timeout = 2.0      # seconds allowed for {cmd:...} placeholders
notify = false         # notification after every copy (run-on-Enter results and errors always notify)

[abbr]
# --- dates & times
isod = { text = "{date}", description = "Today's date (ISO)" }
isodt = { text = "{now}", description = "Date and time (ISO)" }
isot = { text = "{time}", description = "Current time" }
ts = { text = "{now:%Y%m%d-%H%M%S}", description = "Timestamp for file names" }
tmrw = { text = "{date+1d}", description = "Tomorrow's date" }
yday = { text = "{date-1d}", description = "Yesterday's date" }
nweek = { text = "{date+1w}", description = "Date one week from today" }
dmy = { text = "{date:%d/%m/%Y}", description = "Today as day/month/year" }
longd = { text = "{date:%A, %d %B %Y}", description = "Today, written out" }
week = { text = "{date:%G-W%V}", description = "ISO week number" }
epoch = { text = "{now:%s}", description = "Unix timestamp" }

# --- misc dynamic
uuid = { text = "{uuid}", description = "Random UUID" }
me = { text = "{env:USER}", description = "Your user name" }
quote = { text = "“{clipboard}”", description = "Clipboard in “curly quotes”" }
kernel = { text = "{cmd:uname -r}", description = "Linux kernel version" }

# --- with arguments
gh = { text = "https://github.com/{arg}", description = "GitHub URL: gh username" }

# --- symbols
em = { text = "—", description = "Em dash" }
en = { text = "–", description = "En dash" }
sect = { text = "§", description = "Section sign" }
para = { text = "¶", description = "Pilcrow (paragraph sign)" }
check = { text = "✓", description = "Check mark" }

# --- clipboard (or typed text) transformations: copy, then e.g. "ex title"
[abbr.title]
text = "{input|title}"
description = "Clipboard or typed text → Title Case"
icon = "format-text-capitalize"

[abbr.lower]
text = "{input|lower}"
description = "Clipboard or typed text → lowercase"
icon = "format-text-lowercase"

[abbr.upper]
text = "{input|upper}"
description = "Clipboard or typed text → UPPERCASE"
icon = "format-text-uppercase"

[abbr.sentence]
text = "{input|sentence}"
description = "Clipboard or typed text → Sentence case"
icon = "format-text-capitalize"

[abbr.caps]
text = "{input|capitalize}"
description = "Clipboard or typed text → Capitalize Every Word"
icon = "format-text-capitalize"

[abbr.swap]
text = "{input|swapcase}"
description = "Clipboard or typed text → sWAP cASE"
icon = "format-text-capitalize"

[abbr.snake]
text = "{input|snake}"
description = "Clipboard or typed text → snake_case"
icon = "format-text-code"

[abbr.kebab]
text = "{input|kebab}"
description = "Clipboard or typed text → kebab-case"
icon = "format-text-code"

[abbr.camel]
text = "{input|camel}"
description = "Clipboard or typed text → camelCase"
icon = "format-text-code"

[abbr.pascal]
text = "{input|pascal}"
description = "Clipboard or typed text → PascalCase"
icon = "format-text-code"

[abbr.const]
text = "{input|constant}"
description = "Clipboard or typed text → CONSTANT_CASE"
icon = "format-text-code"

[abbr.join]
text = "{input|join}"
description = "Join clipboard lines into one"
icon = "format-join-node"

[abbr.unwrap]
text = "{input|unhyphen|join|squeeze}"
description = "Clean up text copied from a PDF"
icon = "format-join-node"

[abbr.slug]
text = "{input|slug}"
description = "Clipboard or typed text → url-slug"
icon = "edit-link"

# --- latex & markdown
[abbr.emph]
text = '\emph{{{input}}}'
description = 'Wrap in \emph{}'
icon = "format-text-italic"

[abbr.cite]
text = '\cite{{{input}}}'
description = 'Wrap in \cite{}'
icon = "format-text-code"

[abbr.latex]
text = "{input|latex}"
description = "Escape LaTeX special characters"
icon = "format-text-code"

[abbr.mdlink]
text = "[{arg}]({clipboard})"
description = "Markdown link: mdlink Title (URL from clipboard)"
icon = "edit-link"

[abbr.guil]
text = "«{input}»"
description = "Spanish quotes «…»"
icon = "format-text-blockquote"

# --- latin
[abbr.annus]
text = "{date:%Y|roman}"
description = "Current year in Roman numerals"
icon = "view-calendar"

[abbr.roman]
text = "{input|roman}"
description = "Number → Roman numeral"
icon = "format-number"

[abbr.unroman]
text = "{input|unroman}"
description = "Roman numeral → number"
icon = "format-number"

[abbr.macrons]
text = "{input|nomacrons}"
description = "Remove macrons and breves"
icon = "format-text-lowercase"

# --- utilities
[abbr.wc]
text = "{input|stats}"
description = "Word, character and line count"
icon = "format-list-ordered"

[abbr.on]
text = '{cmd:date -d "$ABBR_ARG" +%F 2>&1}'
description = "Date from plain English: on next friday"
icon = "view-calendar"

[abbr.bib]
text = '{cmd:curl -sLf -H "Accept: application/x-bibtex; charset=utf-8" "https://doi.org/$(echo "$ABBR_INPUT" | sed "s|.*doi.org/||")"|strip}'
description = "BibTeX for a DOI (typed or copied)"
icon = "bookmarks"
lazy = true             # computed only when Enter is pressed

# --- quotes (clipboard or typed text)
[abbr.g2d]
text = "{input|quotes(guillemets, double, double, single)}"
description = "«…“…”…» → “…‘…’…”"
icon = "format-text-blockquote"

[abbr.d2g]
text = "{input|quotes(double, guillemets, single, double)}"
description = "“…‘…’…” → «…“…”…»"
icon = "format-text-blockquote"

[abbr.g2s]
text = "{input|quotes(guillemets, single)}"
description = "«…» → ‘…’"
icon = "format-text-blockquote"

[abbr.d2s]
text = "{input|quotes(double, single, single, double)}"
description = "“…” ⇄ ‘…’ (swaps nested quotes too)"
icon = "format-text-blockquote"

[abbr.smartq]
text = "{input|smartquotes}"
description = "\"…\" '…' → “…” ‘…’ (and apostrophes)"
icon = "format-text-blockquote"

[abbr.straightq]
text = "{input|straightquotes}"
description = "“…” ‘…’ «…» „…“ → \"…\" '…'"
icon = "format-text-blockquote"

# --- legal and typographic symbols
[abbr.copy]
text = "©"
description = "Copyright"

[abbr.crme]
text = "© {date:%Y} Your Name"
description = "Copyright notice, current year"

[abbr.reg]
text = "®"
description = "Registered trademark"

[abbr.tm]
text = "™"
description = "Trademark"

[abbr.sm]
text = "℠"
description = "Service mark"

[abbr.phono]
text = "℗"
description = "Sound recording copyright"

[abbr.copyleft]
text = "🄯"
description = "Copyleft"

[abbr.deg]
text = "°"
description = "Degree"

[abbr.dag]
text = "†"
description = "Dagger"

[abbr.ddag]
text = "‡"
description = "Double dagger"

[abbr.bullet]
text = "•"
description = "Bullet"

[abbr.ell]
text = "…"
description = "Ellipsis"

[abbr.times]
text = "×"
description = "Multiplication sign"

[abbr.nbsp]
text = " "
description = "Non-breaking space (invisible)"
icon = "format-text-symbol"

[abbr.nnbsp]
text = " "
description = "Narrow non-breaking space (invisible)"
icon = "format-text-symbol"

# --- lists (clipboard or typed text)
[abbr.sort]
text = "{input|sort}"
description = "Sort clipboard lines A→Z"
icon = "view-sort-ascending"

[abbr.sortr]
text = "{input|sort(reverse)}"
description = "Sort clipboard lines Z→A"
icon = "view-sort-descending"

[abbr.sortu]
text = "{input|sort|uniq}"
description = "Sort clipboard lines, dropping duplicates"
icon = "view-sort-ascending"

[abbr.sortc]
text = "{input|sortitems(\", \")}"
description = "Sort a comma-separated list"
icon = "view-sort-ascending"

[abbr.numl]
text = "{input|number}"
description = "Number clipboard lines: 1. 2. 3."
icon = "format-list-ordered"

# --- prompts: these open an input dialog when Enter is pressed
[abbr.citep]
text = '\cite[p.~{ask:Page}]{{{input}}}'
description = '\cite[p.~N]{key}: asks for the page'
icon = "format-text-code"

[abbr.letter]
text = '''
Dear {ask:Name},

{asktext:Message}

Best,
Your Name'''
description = "Short letter: asks for name and message"
icon = "mail-message-new"

[abbr.days]
text = '{ask:Date (e.g. 2026-12-25 or next friday)|sh(n=$(( ($(date -d "$(cat)" +%s) - $(date -d today +%s)) / 86400 )); [ "$n" -eq 1 ] && echo "1 day" || echo "$n days")}'
description = "Days until a date (asks for it)"
icon = "view-calendar"

[abbr.askdoi]
text = '{ask:DOI|sh(curl -sLf -H "Accept: application/x-bibtex; charset=utf-8" "https://doi.org/$(sed "s|.*doi.org/||")")|strip}'
description = "BibTeX for a DOI (asks for it)"
icon = "bookmarks"

# --- static text (table form with a description)
[abbr.sig]
text = """
Best,
Your Name"""
description = "Email signature"
icon = "mail-signed"

[abbr.mail]
text = "you@example.com"
description = "Email address"
